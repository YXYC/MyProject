spring.application.name=PatientMange
# \u70ED\u90E8\u7F72\u751F\u6548
spring.devtools.restart.enabled=true
# \u8BBE\u7F6E\u91CD\u542F\u76EE\u5F55
spring.devtools.restart.additional-paths=src/main/java
# \u8BBE\u7F6Eclasspath\u76EE\u5F55\u4E0B\u7684WEB-INF\u6587\u4EF6\u5939\u5185\u5BB9\u4E0D\u91CD\u542F
spring.devtools.restart.exclude=static/**


# \u914D\u7F6E\u6570\u636E\u5E93
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/MediSmart?useSSL=false&useUnicode=true&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=wei74521

#\u914D\u7F6Emybatis
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# \u914D\u7F6E\u9759\u6001\u6587\u4EF6\u76EE\u5F55
spring.mvc.static-path-pattern=/static/**
# \u914D\u7F6E\u9759\u6001\u6587\u4EF6\u8DEF\u5F84\uFF0C\u53EF\u4EE5\u76F4\u63A5\u8FDB\u884C\u8BBF\u95EE
spring.web.resources.static-locations=/upload/

# \u5B9A\u4E49\u5355\u4E2A\u6587\u4EF6\u6700\u5927\u5927\u5C0F\u548C\u5355\u6B21\u8BF7\u6C42\u6700\u5927\u5927\u5C0F
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#\u5F00\u542FopenApi\u63A5\u53E3
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
#\u5F00\u542Fswagger\u9875\u9762
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html